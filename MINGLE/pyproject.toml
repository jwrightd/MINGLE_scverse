[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "MINGLE"
version = "0.1.0"
description = "MINGLE: scverse-compatible neighborhood analysis and visualization package"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
  { name = "James Wright", email = "james.wright@duke.edu" }
]
requires-python = ">=3.9"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
]
dependencies = [
  "anndata>=0.10",
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.2",
  "matplotlib>=3.8",
  "seaborn>=0.12",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pre-commit",
  "twine>=4.0.2",
]
doc = [
  "sphinx>=8.1",
  "sphinx-book-theme>=1",
  "myst-nb>=1.1",
  "sphinx-copybutton",
  "sphinx-tabs",
  "sphinxcontrib-bibtex>=1",
  "sphinxext-opengraph",
  "ipykernel",
  "ipython",
  "pandas",
  "setuptools",
]
test = [
  "pytest",
  "coverage>=7.10",
  "pytest-cov",
]

[project.urls]
Homepage = "https://github.com/jwrightd/MINGLE_scverse"
Documentation = "https://MINGLE.readthedocs.io/"
Source = "https://github.com/jwrightd/MINGLE_scverse"

[tool.hatch.build.targets.wheel]
packages = ["src/MINGLE"]

[tool.hatch.envs.default]
features = ["dev"]

[tool.hatch.envs.docs]
features = ["doc"]
scripts.build = "sphinx-build -M html docs docs/_build -W {args}"
scripts.open = "python -m webbrowser -t docs/_build/html/index.html"
scripts.clean = "git clean -fdX -- {args:docs}"

[tool.pytest.ini_options]
testpaths = ["tests"]
xfail_strict = true
addopts = ["--import-mode=importlib"]

[tool.ruff]
line-length = 120
src = ["src"]
extend-include = ["*.ipynb"]
format.docstring-code-format = true

lint.select = ["B", "C4", "E", "F", "I", "UP", "W"]
lint.ignore = ["E501", "D100", "D104", "D107"]
lint.per-file-ignores."*/__init__.py" = ["F401"]
